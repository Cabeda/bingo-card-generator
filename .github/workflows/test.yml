name: Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.x'
        cache: false

    - name: Install actionlint
      run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

    - name: Validate workflows
      run: bun run lint:workflows

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Cache Bun dependencies
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Cache Next.js build
      uses: actions/cache@v5
      with:
        path: |
          .next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-
          ${{ runner.os }}-nextjs-

    - name: Run lint
      run: bun run lint

    - name: Run typecheck
      run: bun run typecheck

    - name: Run all tests with complete production coverage
      run: bun run test:coverage --runInBand

    - name: Run critical game tests
      run: bun run test:game

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage/
        if-no-files-found: ignore

    - name: Build application
      run: bun run build


  native-print:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Cache Bun dependencies
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Build application
      run: bun run build

    - name: Check native WebKit print pagination
      env:
        PRINT_TEST_URL: http://localhost:3000/en
      run: |
        set -euo pipefail
        mkdir -p print-diagnostics
        bun run start > print-diagnostics/server.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        ready=false
        for attempt in {1..60}; do
          if ! kill -0 "$server_pid" 2>/dev/null; then
            echo 'Application server exited before becoming ready.' >&2
            cat print-diagnostics/server.log
            exit 1
          fi
          if curl --fail --silent --max-time 2 "$PRINT_TEST_URL" > /dev/null; then
            ready=true
            break
          fi
          sleep 1
        done
        if [[ "$ready" != true ]]; then
          echo 'Application server did not become ready within the polling limit.' >&2
          cat print-diagnostics/server.log
          exit 1
        fi
        bun run test:print:webkit 2>&1 | tee print-diagnostics/webkit.log

    - name: Upload print failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: native-print-diagnostics
        path: print-diagnostics/
        if-no-files-found: ignore

  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Install Chromium
      timeout-minutes: 5
      run: bunx playwright install --with-deps chromium

    - name: Build application
      env:
        NEXT_DEPLOYMENT_ID: offline-ci-deployment
      run: bun run build

    - name: Check offline recovery in Chromium
      run: bun run test:offline

    - name: Upload offline failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: offline-diagnostics
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore

  checks:
    if: always()
    needs: [workflows, test, native-print, offline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Confirm all required checks passed
      env:
        WORKFLOWS_RESULT: ${{ needs.workflows.result }}
        TEST_RESULT: ${{ needs.test.result }}
        PRINT_RESULT: ${{ needs.native-print.result }}
        OFFLINE_RESULT: ${{ needs.offline.result }}
      run: |
        test "$WORKFLOWS_RESULT" = success
        test "$TEST_RESULT" = success
        test "$PRINT_RESULT" = success
        test "$OFFLINE_RESULT" = success
        echo 'Tests, complete coverage, build, native print and offline checks passed.'
