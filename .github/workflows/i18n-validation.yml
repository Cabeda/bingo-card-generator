name: I18n Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'messages/**'
      - 'app/**/*.test.ts*'
      - 'scripts/validate-translations.js'
      - 'app/utils/offlineRoutes.ts'
      - '.github/workflows/i18n-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'messages/**'
      - 'app/**/*.test.ts*'
      - 'scripts/validate-translations.js'
      - 'app/utils/offlineRoutes.ts'
      - '.github/workflows/i18n-validation.yml'

jobs:
  validate-translations:
    name: Validate Translation Completeness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate translation files
        run: bun run validate:i18n

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run detailed i18n tests
        run: bun run test:i18n --runInBand

      - name: Success message
        if: success()
        run: echo "✅ All translations are complete and consistent!"
